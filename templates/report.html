<!doctype html>
<html lang="en" data-theme="{{THEME}}" data-size="{{SIZE}}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="generator" content="generate-pr-review-report" />
  <title>{{PAGE_TITLE}}</title>
  <script>
    // ?size=s|m|l and ?theme=light|dark override the defaults set at generation.
    (() => {
      try {
        const q = new URLSearchParams(location.search), root = document.documentElement;
        const size = (q.get('size') || '').toLowerCase(), theme = (q.get('theme') || '').toLowerCase();
        if (['s', 'm', 'l'].includes(size)) root.dataset.size = size;
        if (['light', 'dark'].includes(theme)) root.dataset.theme = theme;
      } catch {}
    })();
  </script>
  <style>
    /* ---------- Theme tokens ---------- */
    :root {
      color-scheme: light;
      --page-bg: radial-gradient(circle at 46% 0%, #efedfc 0, #f8f9ff 46%, #f5f6fc 100%);
      --ink: #111834; --muted: #53607d; --soft: #68718f; --meta: #506084; --label: #1e2a4d; --icon: #25305a;
      --stroke: #d9def0; --stroke-soft: #e1e4ef; --stroke-strong: #c6cce5; --stroke-item: #d5dcee;
      --surface-app: rgba(255,255,255,.65); --surface-card: #ffffffb0; --surface: #fff;
      --surface-sunken: #f7f8fc; --surface-chip: #f1f3f9; --surface-input: #fbfcff;
      --brand: #5b35b2; --beta-bg: #eae6f6; --beta-ink: #443099;
      --purple: #6945c5; --purple-ink: #4b2baf; --purple-bg: #efeaff; --purple-border: #d1c4ff;
      --hover-bg: #f4f0ff; --hover-border: #9b83e7;
      --add-ink: #078c3c; --add-bg: #edfaf2; --add-border: #d3eddd;
      --del-ink: #d12c3c; --del-bg: #fff2f3; --del-border: #f6dfe1;
      --red: #d63d43; --orange: #f0ac08; --blue: #3078df;
      --must-bg: #fce5e8; --must-ink: #821b25;
      --consider-bg: #fff1d8; --consider-ink: #7b4800;
      --nit-bg: #dfeeff; --nit-ink: #1454be;
      --ready-bg: #e6f8ec; --ready-border: #c3ebd0; --ready-ink: #0f7a3b;
      --copied-bg: #eaf9ef; --copied-border: #9bd9b2; --copied-ink: #16834a;
      --diff-bg: #f8fafc; --diff-border: #dce0ed; --diff-add: #ddfae7; --diff-del: #fce7e8; --line-num: #8390a6;
      --pr-icon-bg: #252a31; --toast-bg: #1e2444; --hl-bg: #f1ecff;
      --shadow-card: 0 2px 6px #343c7610; --shadow-app: 0 10px 35px #20285d08;
      --ill-shadow: #e6e1fb; --ill-cloud: #e8e4fb; --ill-badge: #ddf6e5; --ill-badge-stroke: #3fae68; --ill-check: #11793d; --ill-spark: #7a56dd;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --page-bg: radial-gradient(circle at 46% 0%, #221d3f 0, #12141f 46%, #0e1019 100%);
      --ink: #e7e9f3; --muted: #a6aec6; --soft: #8a92ad; --meta: #a0a9c4; --label: #d3d8ea; --icon: #c3c9de;
      --stroke: #2b3150; --stroke-soft: #2d3350; --stroke-strong: #3a4166; --stroke-item: #2e3554;
      --surface-app: rgba(22,25,40,.72); --surface-card: #171a2bcc; --surface: #1a1e31;
      --surface-sunken: #20253a; --surface-chip: #252b42; --surface-input: #151929;
      --brand: #b7a2ff; --beta-bg: #2e2852; --beta-ink: #c9bcff;
      --purple: #9b7ff0; --purple-ink: #cdbfff; --purple-bg: #2d2650; --purple-border: #4d3f8a;
      --hover-bg: #29234a; --hover-border: #6b55c4;
      --add-ink: #4fd286; --add-bg: #14301f; --add-border: #1f4a30;
      --del-ink: #ff7a85; --del-bg: #3a1a20; --del-border: #5a2730;
      --red: #f0626a; --orange: #f5bc3a; --blue: #5c9bf0;
      --must-bg: #46191f; --must-ink: #ffb3ba;
      --consider-bg: #3e2e0d; --consider-ink: #ffd38a;
      --nit-bg: #16294a; --nit-ink: #a3c6ff;
      --ready-bg: #133222; --ready-border: #21553a; --ready-ink: #6ee29e;
      --copied-bg: #133222; --copied-border: #2a6b47; --copied-ink: #6ee29e;
      --diff-bg: #131726; --diff-border: #2b3150; --diff-add: #143322; --diff-del: #3b1a21; --line-num: #6c7594;
      --pr-icon-bg: #2c3150; --toast-bg: #2d3456; --hl-bg: #272246;
      --shadow-card: 0 2px 8px #0000004d; --shadow-app: 0 10px 35px #00000059;
      --ill-shadow: #262142; --ill-cloud: #2a2548; --ill-badge: #173a27; --ill-badge-stroke: #3fae68; --ill-check: #6ee29e; --ill-spark: #9b7ff0;
    }

    /* ---------- Size (S / M / L) ----------
       Only text scales; widths and spacing stay fixed. */
    :root { --fs: 1; }
    :root[data-size="s"] { --fs: .9; }
    :root[data-size="l"] { --fs: 1.15; }

    /* ---------- Base ---------- */
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; background: #0e1019; }
    html[data-theme="light"] { background: #f5f6fc; }
    body {
      margin: 0; min-height: 100vh; color: var(--ink); font-size: calc(14px * var(--fs));
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--page-bg) fixed;
    }
    button, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .5; }
    a { color: var(--purple); }
    svg { flex: none; }
    :focus-visible { outline: 2px solid var(--purple); outline-offset: 2px; }

    /* Top bar */
    .topbar { max-width: 1080px; margin-inline: auto; height: 58px; padding-inline: 20px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .brand { display: flex; gap: 10px; align-items: center; font-size: calc(20px * var(--fs)); font-weight: 790; letter-spacing: -.6px; }
    .brand svg { color: var(--brand); }
    .beta { color: var(--beta-ink); background: var(--beta-bg); border-radius: 20px; padding: 4px 11px; font-weight: 650; font-size: calc(12px * var(--fs)); letter-spacing: 0; }
    .topbar-right { display: flex; align-items: center; gap: 14px; }
    .generated { color: var(--soft); font-size: calc(12px * var(--fs)); }
    .view-controls { display: flex; align-items: center; gap: 8px; }
    .seg { display: inline-flex; padding: 2px; border: 1px solid var(--stroke); border-radius: 9px; background: var(--surface-sunken); }
    .seg button { border: 0; background: transparent; color: var(--soft); min-width: 28px; height: 26px; padding: 0 8px; border-radius: 7px; font-size: 12px; font-weight: 700; }
    .seg button:hover { color: var(--ink); }
    .seg button[aria-pressed="true"] { background: var(--surface); color: var(--purple-ink); box-shadow: var(--shadow-card); }
    .theme-toggle { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; padding: 0; border: 1px solid var(--stroke); border-radius: 9px; background: var(--surface-sunken); color: var(--icon); }
    .theme-toggle:hover { border-color: var(--hover-border); color: var(--purple-ink); }
    .theme-toggle .icon-sun, [data-theme="dark"] .theme-toggle .icon-moon { display: none; }
    [data-theme="dark"] .theme-toggle .icon-sun { display: block; }

    /* Shell */
    .app { max-width: 1040px; width: calc(100% - 36px); margin: 0 auto 36px; border: 1px solid var(--stroke); border-radius: 14px; background: var(--surface-app); padding: 20px 23px 25px; box-shadow: var(--shadow-app); }
    /* minmax(0, 1fr): long code lines scroll inside their block instead of widening the page. */
    .layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
    .layout > *, .finding-body, .file-viewer { min-width: 0; }
    .card { background: var(--surface-card); border: 1px solid var(--stroke); border-radius: 12px; box-shadow: var(--shadow-card); }

    /* PR header */
    .pr-header { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 0 3px 22px; }
    .pr-left { display: flex; align-items: center; gap: 16px; min-width: 0; }
    .pr-icon { width: 44px; height: 44px; border-radius: 50%; background: var(--pr-icon-bg); color: #fff; display: grid; place-items: center; flex: none; }
    .pr-title { margin: 0; font-size: calc(23px * var(--fs)); font-weight: 790; letter-spacing: -.65px; line-height: 1.25; overflow-wrap: anywhere; }
    .pr-number { margin-right: 10px; }
    .pr-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: calc(15px * var(--fs)); color: var(--meta); margin-top: 4px; }
    .pr-meta .sep { color: var(--soft); opacity: .7; }
    .add { color: var(--add-ink); font-weight: 600; }
    .del { color: var(--del-ink); font-weight: 600; }
    .branch-pill { display: inline-flex; align-items: center; gap: 5px; font-family: var(--mono); font-size: calc(12px * var(--fs)); color: var(--muted); background: var(--surface-chip); border: 1px solid var(--stroke-soft); border-radius: 6px; padding: 2px 7px; overflow-wrap: anywhere; }

    /* Buttons */
    .button { background: var(--surface); border: 1px solid var(--stroke-strong); border-radius: 8px; padding: 10px 15px; display: inline-flex; justify-content: center; align-items: center; gap: 8px; color: var(--ink); font-weight: 600; white-space: nowrap; text-decoration: none; transition: background .15s, border-color .15s; }
    .button:hover { background: var(--hover-bg); border-color: var(--hover-border); }
    .button.small { padding: 7px 11px; font-size: calc(13px * var(--fs)); }

    /* Section titles */
    .section-title { display: flex; align-items: center; gap: 13px; margin: 0; font-size: calc(20px * var(--fs)); letter-spacing: -.5px; font-weight: 750; }
    .section-title .count { font-weight: 750; margin-left: 4px; }
    .section-icon { display: inline-flex; color: var(--icon); }

    /* Summary */
    .summary-card { padding: 21px 24px 23px; }
    .summary-heading { margin-bottom: 18px; }
    .summary-heading .section-title { margin-bottom: 13px; }
    .summary-stats { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; }
    .stat-pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border: 1px solid var(--stroke-soft); border-radius: 999px; background: var(--surface-sunken); color: var(--muted); font-size: calc(12px * var(--fs)); font-weight: 620; white-space: nowrap; }
    .stat-pill.add { background: var(--add-bg); color: var(--add-ink); border-color: var(--add-border); }
    .stat-pill.del { background: var(--del-bg); color: var(--del-ink); border-color: var(--del-border); }
    .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--red); flex: none; }
    .dot.consider { background: var(--orange); }
    .dot.nit { background: var(--blue); }

    /* Markdown content */
    .md { line-height: 1.55; overflow-wrap: anywhere; }
    .md > :first-child { margin-top: 0; }
    .md > :last-child { margin-bottom: 0; }
    .md p { margin: 0 0 12px; }
    .md h3, .md h4, .md h5, .md h6 { margin: 18px 0 8px; font-size: calc(16px * var(--fs)); font-weight: 720; letter-spacing: -.2px; }
    .md h4, .md h5, .md h6 { font-size: calc(15px * var(--fs)); }
    .md ul, .md ol { margin: 8px 0 12px; padding-left: 22px; }
    .md li { margin: 3px 0; padding-left: 2px; }
    .md li > ul, .md li > ol { margin: 3px 0; }
    .md code { font-family: var(--mono); font-size: .9em; background: var(--surface-chip); border-radius: 4px; padding: 1px 5px; }
    .md pre { background: var(--diff-bg); border: 1px solid var(--diff-border); border-radius: 8px; padding: 10px 12px; overflow: auto; font-size: calc(12px * var(--fs)); line-height: 1.55; }
    .md pre code { background: none; padding: 0; font-size: inherit; }
    .md blockquote { margin: 0 0 12px; padding: 2px 0 2px 12px; border-left: 3px solid var(--purple-border); color: var(--muted); }
    .md hr { border: 0; border-top: 1px solid var(--stroke); margin: 16px 0; }
    .summary-text { font-size: calc(15px * var(--fs)); }
    .muted { color: var(--soft); }

    /* Review toolbar */
    .reviews-card { padding: 13px 13px 16px; }
    .review-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 4px 5px 15px; flex-wrap: wrap; }
    .toolbar-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .filters { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
    .filter { display: inline-flex; align-items: center; gap: 7px; border-radius: 10px; border: 1px solid var(--stroke-item); background: var(--surface-input); padding: 7px 12px; font-size: calc(13px * var(--fs)); color: var(--ink); white-space: nowrap; }
    .filter:not(:disabled):hover { border-color: var(--hover-border); }
    .filter.active { background: var(--purple-bg); border-color: var(--purple-border); color: var(--purple-ink); }
    .ready-pill { display: inline-flex; align-items: center; gap: 8px; padding: 8px 15px; border-radius: 999px; background: var(--ready-bg); border: 1px solid var(--ready-border); color: var(--ready-ink); font-weight: 650; font-size: calc(13px * var(--fs)); white-space: nowrap; }
    .ready-pill.large { font-size: calc(16px * var(--fs)); padding: 10px 22px; }

    /* Findings */
    .finding { border: 1px solid var(--stroke-item); border-radius: 10px; background: var(--surface); margin-bottom: 10px; overflow: hidden; }
    .finding:last-of-type { margin-bottom: 0; }
    .finding-top { display: flex; align-items: center; gap: 12px; padding: 10px 14px; min-height: 46px; }
    .chevron { border: none; background: transparent; padding: 2px; color: var(--icon); display: inline-flex; border-radius: 6px; transform: rotate(-90deg); transition: transform .15s; flex: none; }
    .chevron:hover { background: var(--surface-chip); }
    .finding.expanded .chevron { transform: rotate(0); }
    .severity { display: inline-flex; align-items: center; gap: 6px; border-radius: 12px; padding: 5px 10px; font-size: calc(12px * var(--fs)); font-weight: 620; white-space: nowrap; flex: none; }
    .severity.must-fix { background: var(--must-bg); color: var(--must-ink); }
    .severity.consider { background: var(--consider-bg); color: var(--consider-ink); }
    .severity.nit { background: var(--nit-bg); color: var(--nit-ink); }
    .severity .dot { width: 8px; height: 8px; }
    .finding-title-row { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; flex-wrap: wrap; }
    .finding-name { border: 0; background: none; padding: 0; text-align: left; font-size: calc(15px * var(--fs)); font-weight: 720; }
    .finding-name:hover { color: var(--purple-ink); }
    .file-location { color: var(--muted); background: var(--surface-chip); border-radius: 6px; padding: 5px 8px; font-size: calc(12px * var(--fs)); font-family: var(--mono); overflow-wrap: anywhere; min-width: 0; }
    .selection { margin-left: auto; padding: 4px; display: flex; cursor: pointer; flex: none; }
    .selection input { accent-color: #16a34a; width: 17px; height: 17px; cursor: pointer; margin: 0; }
    .copy-icon { display: inline-flex; align-items: center; justify-content: center; flex: none; width: 29px; height: 29px; padding: 0; border: 1px solid var(--stroke-item); border-radius: 7px; background: var(--surface); color: var(--soft); transition: all .12s; }
    .copy-icon:hover { background: var(--hover-bg); border-color: var(--hover-border); color: var(--purple-ink); }
    .copy-icon svg + svg, .copy-icon.copied svg:first-child { display: none; }
    .copy-icon.copied svg + svg { display: block; }
    .copy-icon.copied { background: var(--copied-bg); border-color: var(--copied-border); color: var(--copied-ink); }
    .finding-body { padding: 2px 17px 16px 54px; }
    .finding:not(.expanded) .finding-body { display: none; }
    .explanation { font-size: calc(14px * var(--fs)); margin-bottom: 14px; }
    .field-label { font-size: calc(12px * var(--fs)); font-weight: 680; display: flex; align-items: center; gap: 8px; margin: 12px 0 7px; color: var(--label); }
    .comment-area { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 9px; align-items: center; border: 1px solid var(--stroke-item); background: var(--surface-input); border-radius: 8px; padding: 7px; transition: border-color .15s; }
    .comment-area:focus-within { border-color: var(--hover-border); }
    .comment-area textarea { border: none; resize: vertical; background: transparent; outline: none; min-height: 40px; width: 100%; line-height: 1.45; padding: 5px 7px; }
    .comment-area .copy-icon { width: 33px; height: 33px; margin-right: 3px; }
    .code-label { flex-wrap: wrap; }
    .view-file-button { display: inline-flex; align-items: center; gap: 5px; margin-left: 4px; padding: 3px 9px; border: 1px solid var(--stroke-item); border-radius: 7px; background: var(--surface); color: var(--purple-ink); font-size: calc(12px * var(--fs)); font-weight: 600; transition: background .15s, border-color .15s; }
    .view-file-button:hover, .view-file-button[aria-expanded="true"] { background: var(--purple-bg); border-color: var(--purple-border); }
    .code-diff .code-line.hl { background: var(--hl-bg); box-shadow: inset 3px 0 var(--purple); }
    .code-diff .code-more .code-text { color: var(--soft); font-style: italic; }
    .finding.file-open .finding-body > .code-diff { display: none; }
    .code-diff { border: 1px solid var(--diff-border); border-radius: 8px; overflow: auto; background: var(--diff-bg); font-family: var(--mono); font-size: calc(12px * var(--fs)); line-height: 1.6; }
    .code-line { display: flex; min-width: max-content; }
    .code-line.removed { background: var(--diff-del); }
    .code-line.added { background: var(--diff-add); }
    .line-num { color: var(--line-num); min-width: 42px; text-align: right; padding: 1px 8px; user-select: none; }
    .code-sign { width: 20px; padding: 1px 4px; user-select: none; color: var(--soft); }
    .code-text { padding: 1px 16px 1px 4px; white-space: pre; }
    /* File viewer (full file, opened from the path button) */
    .file-location.clickable { display: inline-flex; align-items: center; gap: 6px; border: 1px solid transparent; cursor: pointer; text-align: left; transition: border-color .15s, background .15s; }
    .file-location.clickable:hover { border-color: var(--hover-border); color: var(--purple-ink); }
    .file-location.clickable svg { width: 13px; height: 13px; }
    .file-location.clickable svg:last-child { transition: transform .15s; }
    .file-location.clickable[aria-expanded="true"] { background: var(--purple-bg); border-color: var(--purple-border); color: var(--purple-ink); }
    .file-location.clickable[aria-expanded="true"] svg:last-child { transform: rotate(180deg); }
    .file-viewer { margin: 0; border: 1px solid var(--diff-border); border-radius: 8px; overflow: hidden; background: var(--diff-bg); }
    .file-viewer-head { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 12px; padding: 7px 8px 7px 12px; border-bottom: 1px solid var(--diff-border); background: var(--surface-sunken); font-size: calc(12px * var(--fs)); }
    .file-viewer-path { font-family: var(--mono); font-weight: 650; overflow-wrap: anywhere; }
    .file-viewer-meta { color: var(--soft); display: inline-flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .legend { display: inline-flex; align-items: center; gap: 5px; }
    .legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
    .legend .l-hl { background: var(--hl-bg); box-shadow: inset 2px 0 var(--purple); }
    .legend .l-add { background: var(--diff-add); }
    .legend .l-del { background: var(--diff-del); }
    .file-viewer-close { margin-left: auto; width: 26px; height: 26px; }
    .file-viewer-code { max-height: 460px; overflow: auto; position: relative; font-family: var(--mono); font-size: calc(12px * var(--fs)); line-height: 1.6; }
    .file-viewer-code .code-line.hl { background: var(--hl-bg); }
    .file-viewer-code .code-line.hl, .file-viewer-code .code-line.added, .file-viewer-code .code-line.removed { box-shadow: inset 3px 0 var(--purple); }
    .file-viewer-code .code-line.added { background: var(--diff-add); }
    .file-viewer-code .code-line.removed { background: var(--diff-del); }

    .empty-filter { text-align: center; padding: 32px 15px; color: var(--soft); }

    /* Empty state */
    .empty-state { border: 1px solid var(--stroke-item); border-radius: 10px; background: var(--surface); text-align: center; padding: 34px 20px 44px; }
    .empty-illustration { width: 290px; max-width: 100%; height: auto; }
    .ill-shadow { fill: var(--ill-shadow); }
    .ill-cloud { fill: var(--ill-cloud); }
    .ill-badge { fill: var(--ill-badge); stroke: var(--ill-badge-stroke); }
    .ill-check { stroke: var(--ill-check); }
    .ill-spark { stroke: var(--ill-spark); }
    .empty-state h3 { margin: 10px 0 8px; font-size: calc(28px * var(--fs)); font-weight: 790; letter-spacing: -.9px; }
    .empty-state p { margin: 0 0 24px; color: var(--muted); font-size: calc(17px * var(--fs)); }
    .empty-actions { display: flex; flex-direction: column; align-items: center; gap: 16px; }

    /* Toast */
    .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--toast-bg); color: #fff; padding: 11px 18px; border-radius: 10px; box-shadow: 0 10px 30px #0e13374d; opacity: 0; pointer-events: none; transition: .2s; z-index: 30; }
    /* MCP app mode: loading state and the host-only buttons */
    .app-only[hidden] { display: none !important; }
    .mcp-app body { min-height: 0; }
    .app-only .icon-collapse, .app-only[aria-pressed="true"] .icon-expand { display: none; }
    .app-only[aria-pressed="true"] .icon-collapse { display: block; }
    .app-loading { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 64px 16px; color: var(--muted); text-align: center; }
    .app-loading.error { color: var(--ink); }
    .app-loading .spinner { width: 26px; height: 26px; border: 3px solid var(--stroke); border-top-color: var(--purple); border-radius: 50%; animation: spin .8s linear infinite; }
    .app-loading.error .spinner { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (max-width: 720px) {
      .app { width: calc(100% - 16px); padding: 14px; }
      .summary-card { padding: 16px; }
      .pr-title { font-size: calc(19px * var(--fs)); }
      .pr-meta { font-size: calc(13px * var(--fs)); }
      .finding-top { flex-wrap: wrap; }
      .finding-title-row { flex-basis: 70%; }
      .finding-body { padding: 4px 12px 15px; }
      .empty-state h3 { font-size: calc(22px * var(--fs)); }
      .empty-state p { font-size: calc(15px * var(--fs)); }
      .generated { display: none; }
    }
    @media (max-width: 610px) {
      .topbar { padding-inline: 14px; }
      .brand { font-size: calc(17px * var(--fs)); }
      .beta { display: none; }
      .pr-header { flex-wrap: wrap; }
      .pr-icon { width: 36px; height: 36px; }
      .pr-left { gap: 11px; }
      .summary-text { font-size: calc(14px * var(--fs)); }
      .stat-pill { font-size: calc(11px * var(--fs)); }
      .finding-top { gap: 8px; padding: 9px 9px; }
      .finding-name { font-size: calc(14px * var(--fs)); }
      .file-location { font-size: calc(11px * var(--fs)); }
    }
    @media print {
      body { background: #fff; }
      .app { border: 0; box-shadow: none; width: 100%; }
      .view-controls, .app-only, .copy-icon, .selection, .filters, [data-action="copy-review"], .chevron { display: none !important; }
      .finding { break-inside: avoid; }
      .finding-body { display: block !important; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.5c.6 5 3.5 8.6 9.5 9.5-6 .9-8.9 4.5-9.5 9.5-.6-5-3.5-8.6-9.5-9.5 6-.9 8.9-4.5 9.5-9.5Z"/></svg>
      AI PR Review <span class="beta">Beta</span>
    </div>
    <div class="topbar-right">
      <time class="generated" datetime="{{GENERATED_ISO}}">Generated {{GENERATED_AT}}</time>
      <div class="view-controls">
        <div class="seg" role="group" aria-label="Text size">
          <button type="button" data-action="size" data-size="s" title="Small text" aria-pressed="false">S</button>
          <button type="button" data-action="size" data-size="m" title="Medium text" aria-pressed="false">M</button>
          <button type="button" data-action="size" data-size="l" title="Large text" aria-pressed="false">L</button>
        </div>
        <button type="button" class="theme-toggle" data-action="theme" title="Toggle dark mode" aria-label="Toggle dark mode" aria-pressed="false">
          <svg class="icon-moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
        </button>
        <!-- Only shown when the report runs as an MCP app inside an agent host. -->
        <button type="button" class="theme-toggle app-only" data-action="app-download" title="Download the HTML report" aria-label="Download the HTML report" hidden>
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10.5l5 5 5-5M5 20h14"/></svg>
        </button>
        <button type="button" class="theme-toggle app-only" data-action="app-fullscreen" title="Expand to full screen" aria-label="Expand to full screen" aria-pressed="false" hidden>
          <svg class="icon-expand" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M10 20H4v-6M20 4l-6.5 6.5M4 20l6.5-6.5"/></svg>
          <svg class="icon-collapse" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10h-6V4M4 14h6v6M14 10l6.5-6.5M10 14l-6.5 6.5"/></svg>
        </button>
      </div>
    </div>
  </header>
  <main class="app">
    {{HEADER}}
    <div class="layout">
      {{SUMMARY}}
      {{REVIEWS}}
    </div>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="application/json" id="review-data">{{DATA_JSON}}</script>
  <script>
    (() => {
      const root = document.documentElement;
      let data, findings = [], toastTimer;

      // Reads the review data and the rendered findings from the page. Runs on
      // load for a static report; in an MCP app it runs again each time a new
      // report is put into the page.
      function load() {
        data = JSON.parse(document.getElementById('review-data').textContent);
        findings = [...document.querySelectorAll('.finding')];
        syncViewControls();
      }

      // View preferences (size, theme): generated defaults from the CLI flags,
      // overridden by ?size= / ?theme= in the URL (read in <head>).
      function syncViewControls() {
        document.querySelectorAll('[data-action="size"]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.size === root.dataset.size)));
        const dark = root.dataset.theme === 'dark';
        const toggle = document.querySelector('[data-action="theme"]');
        toggle.setAttribute('aria-pressed', String(dark));
        toggle.title = dark ? 'Switch to light mode' : 'Switch to dark mode';
      }

      // Keep ?size= and ?theme= in the address bar so a link or bookmark reopens the same view.
      function saveViewToUrl() {
        try {
          const url = new URL(location.href);
          url.searchParams.set('size', root.dataset.size);
          url.searchParams.set('theme', root.dataset.theme);
          history.replaceState(history.state, '', url);
        } catch {}
      }

      const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
      const codeRow = (cls, num, sign, code) =>
        `<div class="code-line ${cls}"><span class="line-num">${num ?? ''}</span><span class="code-sign">${sign}</span><span class="code-text">${esc(code) || ' '}</span></div>`;

      // Full file with the commented lines highlighted and the suggestion
      // (if any) shown in place as a diff.
      function buildFileViewer(f) {
        const lines = data.files[f.file].split('\n');
        if (lines.length > 1 && lines[lines.length - 1] === '') lines.pop();
        const hunk = f.hunk;
        const hl = (n) => f.lineStart != null && n >= f.lineStart && n <= f.lineEnd ? ' hl' : '';
        const rows = [];
        let n = 1;
        let hunkDone = !hunk;
        const emitHunk = () => {
          hunkDone = true;
          for (const [type, code] of hunk.rows) {
            if (type === 'added') rows.push(codeRow('added', '', '+', code));
            else { rows.push(codeRow(`${type}${hl(n)}`, n, type === 'removed' ? '−' : '', lines[n - 1] ?? code)); n++; }
          }
        };
        while (n <= lines.length) {
          if (!hunkDone && n === hunk.start) { emitHunk(); continue; }
          rows.push(codeRow(`context${hl(n)}`, n, '', lines[n - 1]));
          n++;
        }
        if (!hunkDone) emitHunk();

        const range = f.lineStart == null ? '' : f.lineStart === f.lineEnd ? `Line ${f.lineStart}` : `Lines ${f.lineStart}–${f.lineEnd}`;
        const legend = [
          range ? '<span class="legend"><i class="l-hl"></i>Commented lines</span>' : '',
          hunk ? '<span class="legend"><i class="l-del"></i>Removed</span><span class="legend"><i class="l-add"></i>Suggested</span>' : '',
        ].join('');
        return `<div class="file-viewer-head">
            <span class="file-viewer-path">${esc(f.file)}</span>
            <span class="file-viewer-meta">${range ? `<span>${range} of ${lines.length}</span>` : `<span>${lines.length} lines</span>`}${legend}</span>
            <button type="button" class="copy-icon file-viewer-close" data-action="close-file" title="Close file" aria-label="Close file">✕</button>
          </div>
          <div class="file-viewer-code" role="region" aria-label="Full content of ${esc(f.file)}" tabindex="0">${rows.join('')}</div>`;
      }

      // The full file opens in the finding body, in place of the snippet / diff.
      // Both the path in the header and the "View full file" button control it.
      function toggleFileViewer(article, open, reveal = false) {
        const viewer = article.querySelector('.file-viewer');
        if (!viewer) return;
        const show = open ?? viewer.hidden;
        if (show && !viewer.childElementCount) {
          const f = data.feedbacks.find((x) => String(x.id) === article.dataset.id);
          viewer.innerHTML = buildFileViewer(f);
        }
        if (show && !article.classList.contains('expanded')) toggle(article);
        viewer.hidden = !show;
        article.classList.toggle('file-open', show);
        article.querySelectorAll('[data-action="view-file"]').forEach((b) => b.setAttribute('aria-expanded', String(show)));
        const label = article.querySelector('.view-file-button span');
        if (label) label.textContent = show ? 'Hide full file' : 'View full file';
        if (show) {
          // Bring the commented lines (or the suggestion) into view.
          const code = viewer.querySelector('.file-viewer-code');
          const target = code.querySelector('.hl, .added, .removed');
          if (target) code.scrollTop = Math.max(0, target.offsetTop - 48);
          if (reveal) viewer.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        }
      }

      function toast(message) {
        const el = document.getElementById('toast');
        el.textContent = message;
        el.classList.add('visible');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.remove('visible'), 2400);
      }

      async function copyText(value) {
        if (navigator.clipboard && window.isSecureContext) {
          try { await navigator.clipboard.writeText(value); return true; } catch {}
        }
        const t = document.createElement('textarea');
        t.value = value; t.setAttribute('readonly', ''); t.style.position = 'fixed'; t.style.opacity = '0';
        document.body.appendChild(t); t.select();
        const ok = document.execCommand('copy');
        t.remove();
        return ok;
      }

      function flash(button) {
        button.classList.add('copied');
        clearTimeout(button._reset);
        button._reset = setTimeout(() => button.classList.remove('copied'), 1100);
      }

      function setFilter(filter) {
        document.querySelectorAll('.filter').forEach((b) => {
          const on = b.dataset.filter === filter;
          b.classList.toggle('active', on);
          b.setAttribute('aria-pressed', String(on));
        });
        let shown = 0;
        findings.forEach((f) => {
          const visible = filter === 'all' || f.dataset.severity === filter;
          f.hidden = !visible;
          if (visible) shown++;
        });
        document.getElementById('shown-count').textContent = `(${shown})`;
        const empty = document.querySelector('.empty-filter');
        if (empty) empty.hidden = shown > 0;
      }

      function toggle(article) {
        const open = article.classList.toggle('expanded');
        article.querySelector('.chevron').setAttribute('aria-expanded', String(open));
      }

      function buildMarkdown() {
        const selected = data.feedbacks.filter((f) => {
          const box = document.querySelector(`#finding-${f.id} input[data-action="select"]`);
          return !box || box.checked;
        });
        const out = [`# ${data.pr ? data.pr + ' — ' : ''}${data.title}`, ''];
        const meta = [];
        if (data.author) meta.push(`**Author:** @${data.author}`);
        if (data.branch) meta.push(`**Branch:** \`${data.branch}\``);
        if (data.files != null || data.added != null || data.deleted != null) {
          meta.push(`**Changes:** ${[data.files != null ? `${data.files} files` : '', data.added != null ? `+${data.added}` : '', data.deleted != null ? `−${data.deleted}` : ''].filter(Boolean).join(' ')}`);
        }
        if (data.url) meta.push(`**Link:** ${data.url}`);
        if (meta.length) out.push(meta.join('  \n'), '');
        out.push('## Summary', '', data.summary.trim(), '');
        if (!data.feedbacks.length) {
          out.push('## Review comments', '', 'No feedback — PR looks good to go. ✅ Ready to merge.');
          return out.join('\n');
        }
        out.push(`## Review comments (${selected.length})`, '');
        selected.forEach((f) => {
          const comment = document.getElementById(`comment-${f.id}`)?.value.trim() ?? f.comment;
          out.push(`### ${f.severity}: ${f.title}`, `**Location:** \`${f.location}\``, '', f.text.trim(), '', `**Suggested comment:**`, '', comment.split('\n').map((l) => `> ${l}`).join('\n'), '');
          if (f.suggestion) out.push('```diff', f.suggestion, '```', '');
        });
        return out.join('\n').trimEnd() + '\n';
      }

      document.addEventListener('click', async (event) => {
        const target = event.target.closest('[data-action]');
        if (!target || target.disabled || !data) return;
        const action = target.dataset.action;
        if (action === 'toggle') toggle(target.closest('.finding'));
        else if (action === 'filter') setFilter(target.dataset.filter);
        else if (action === 'size') { root.dataset.size = target.dataset.size; syncViewControls(); saveViewToUrl(); }
        else if (action === 'theme') { root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark'; syncViewControls(); saveViewToUrl(); }
        else if (action === 'view-file') toggleFileViewer(target.closest('.finding'), undefined, target.classList.contains('file-location'));
        else if (action === 'close-file') toggleFileViewer(target.closest('.finding'), false);
        else if (action === 'copy') {
          const value = target.dataset.copyFrom ? document.getElementById(target.dataset.copyFrom).value : target.dataset.copy;
          if (await copyText(value)) flash(target); else toast('Could not copy automatically — select the text instead.');
        } else if (action === 'copy-review') {
          const hasFindings = data.feedbacks.length > 0;
          if (hasFindings && !document.querySelector('input[data-action="select"]:checked')) { toast('Select at least one comment to copy'); return; }
          toast(await copyText(buildMarkdown()) ? 'Review copied as Markdown' : 'Could not copy automatically.');
        }
      });

      window.prReport = { load, toast, syncViewControls };
      if (document.getElementById('review-data').textContent.trim()) load();
    })();
  </script>
  {{APP_SCRIPT}}
</body>
</html>
